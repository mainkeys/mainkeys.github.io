<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1125" viewBox="0 0 760 1125" role="img" aria-labelledby="title desc">
<title id="title">一次调用里，可能往返不止一次</title>
<desc id="desc">时序从 CA 等待 ioctl 开始，OP-TEE 发起 RPC，经 Linux 驱动交给 tee-supplicant 服务。可信线程挂起，RPC 结果返回后恢复同一次请求，最后原请求完成才把最终结果交还 CA。图示为 REE 文件系统 TA 加载的一类 RPC。</desc>
<defs><marker id="head" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#087f8c"/></marker><marker id="mutedhead" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#65798f"/></marker></defs>
<style>text{font-family:system-ui,'Microsoft YaHei',sans-serif;fill:#15354f}.heading{font-size:32px;font-weight:700}.body{font-size:24px}.label{font-size:26px;font-weight:650}.small{font-size:22px;fill:#49657d}.section{font-size:24px;font-weight:650;fill:#0b6876}.white{font-size:26px;font-weight:650;fill:#fff}.whiteSmall{font-size:22px;fill:#d6eff3}.panel{fill:#eaf2f7;stroke:#d1dfe9;stroke-width:2}.card{fill:#fff;stroke:#87a8bc;stroke-width:2}.dark{fill:#153f5b;stroke:#153f5b;stroke-width:2}.soft{fill:#f4f7fa;stroke:#acbdcb;stroke-width:2;stroke-dasharray:7 5}.arrow{fill:none;stroke:#087f8c;stroke-width:3;marker-end:url(#head);stroke-linejoin:round}.dashed{fill:none;stroke:#65798f;stroke-width:2.5;stroke-dasharray:7 5;marker-end:url(#mutedhead);stroke-linejoin:round}.rule{fill:none;stroke:#a5bacb;stroke-width:2}</style>
<rect width="760" height="1125" fill="#f8fbfd"/>
<text x="38" y="57" class="heading" text-anchor="start">一次调用里，可能往返不止一次</text><text x="38" y="95" class="small" text-anchor="start">示意 · 选定的传统 SMC / AArch64 配置</text>
<text x="208" y="151" class="section" text-anchor="middle">Linux / Normal World</text><text x="563" y="151" class="section" text-anchor="middle">OP-TEE / Secure World</text><rect x="62" y="183" width="290" height="95" rx="16" class="card"/><text x="207" y="225.5" class="label" text-anchor="middle">CA → 内核驱动</text><text x="207" y="258.5" class="small" text-anchor="middle">原 ioctl 开始等待</text><rect x="432" y="183" width="270" height="95" rx="16" class="card"/><text x="567" y="225.5" class="label" text-anchor="middle">OP-TEE 处理请求</text><text x="567" y="258.5" class="small" text-anchor="middle">例如准备加载用户 TA</text><path d="M352 230 L432 230" class="arrow"/><text x="393" y="207" class="small" text-anchor="middle">SMC</text><rect x="62" y="364" width="290" height="95" rx="16" class="card"/><text x="207" y="406.5" class="label" text-anchor="middle">驱动识别 RPC</text><text x="207" y="439.5" class="small" text-anchor="middle">分发普通世界服务</text><path d="M567 278 L567 326 L207 326 L207 364" class="arrow"/><text x="397" y="314" class="small" text-anchor="middle">RPC 返回</text><rect x="62" y="534" width="290" height="95" rx="16" class="card"/><text x="207" y="576.5" class="label" text-anchor="middle">tee-supplicant</text><text x="207" y="609.5" class="small" text-anchor="middle">例如读取 REE FS TA</text><rect x="432" y="534" width="270" height="95" rx="16" class="soft"/><text x="567" y="576.5" class="label" text-anchor="middle">可信线程挂起</text><text x="567" y="609.5" class="small" text-anchor="middle">保存待恢复的执行状态</text><path d="M207 459 L207 534" class="arrow"/><text x="237" y="510" class="small" text-anchor="start">内核 / 用户态</text><rect x="62" y="730" width="290" height="95" rx="16" class="soft"/><text x="207" y="772.5" class="label" text-anchor="middle">CA 仍在等待</text><text x="207" y="805.5" class="small" text-anchor="middle">原 ioctl 尚未完成</text><rect x="432" y="730" width="270" height="95" rx="16" class="card"/><text x="567" y="772.5" class="label" text-anchor="middle">恢复可信线程</text><text x="567" y="805.5" class="small" text-anchor="middle">校验内容并继续处理</text><path d="M207 629 L207 678 L567 678 L567 730" class="arrow"/><text x="386" y="666" class="small" text-anchor="middle">RPC 结果 → 恢复调用</text><path d="M603 629 L603 730" class="dashed"/><rect x="62" y="913" width="290" height="88" rx="16" class="card"/><text x="207" y="952" class="label" text-anchor="middle">CA 得到最终结果</text><text x="207" y="985" class="small" text-anchor="middle">原 ioctl 返回</text><rect x="432" y="913" width="270" height="88" rx="16" class="card"/><text x="567" y="952" class="label" text-anchor="middle">原请求最终完成</text><text x="567" y="985" class="small" text-anchor="middle">例如 OpenSession 完成</text><path d="M567 825 L567 913" class="arrow"/><path d="M432 957 L352 957" class="arrow"/><text x="38" y="1054" class="small" text-anchor="start">图中只画一轮 RPC；跨世界交接均经过 Monitor。</text><text x="38" y="1090" class="small" text-anchor="start">RPC 返回 Linux，不等于这次客户端请求已经结束。</text>
</svg>
