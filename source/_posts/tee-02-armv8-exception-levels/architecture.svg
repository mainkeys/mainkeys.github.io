<svg xmlns="http://www.w3.org/2000/svg" width="760" height="945" viewBox="0 0 760 945" role="img" aria-labelledby="title desc">
<title id="title">异常级和安全状态，要分开看</title>
<desc id="desc">二维图以左右区分 Non-secure 与 Secure，以纵向区分 EL0、EL1、EL2，EL3 统管安全状态交接。传统部署的 SMC 经 EL3 进入 OP-TEE，用户 TA 与 pseudo TA 位于不同异常级。</desc>
<defs><marker id="head" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#087f8c"/></marker><marker id="mutedhead" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#65798f"/></marker></defs>
<style>text{font-family:system-ui,'Microsoft YaHei',sans-serif;fill:#15354f}.heading{font-size:32px;font-weight:700}.body{font-size:24px}.label{font-size:26px;font-weight:650}.small{font-size:22px;fill:#49657d}.section{font-size:24px;font-weight:650;fill:#0b6876}.white{font-size:26px;font-weight:650;fill:#fff}.whiteSmall{font-size:22px;fill:#d6eff3}.panel{fill:#eaf2f7;stroke:#d1dfe9;stroke-width:2}.card{fill:#fff;stroke:#87a8bc;stroke-width:2}.dark{fill:#153f5b;stroke:#153f5b;stroke-width:2}.soft{fill:#f4f7fa;stroke:#acbdcb;stroke-width:2;stroke-dasharray:7 5}.arrow{fill:none;stroke:#087f8c;stroke-width:3;marker-end:url(#head);stroke-linejoin:round}.dashed{fill:none;stroke:#65798f;stroke-width:2.5;stroke-dasharray:7 5;marker-end:url(#mutedhead);stroke-linejoin:round}.rule{fill:none;stroke:#a5bacb;stroke-width:2}</style>
<rect width="760" height="945" fill="#f8fbfd"/>
<text x="38" y="57" class="heading" text-anchor="start">异常级和安全状态，要分开看</text><text x="38" y="95" class="small" text-anchor="start">示意 · 选定的传统 SMC / AArch64 配置</text>
<rect x="95" y="138" width="600" height="92" rx="16" class="dark"/><text x="395" y="179" class="white" text-anchor="middle">TF-A BL31 / opteed</text><text x="395" y="212" class="whiteSmall" text-anchor="middle">EL3 · 管理低异常级的安全状态</text><text x="230" y="289" class="section" text-anchor="middle">Non-secure</text><text x="555" y="289" class="section" text-anchor="middle">Secure</text><rect x="95" y="320" width="270" height="92" rx="16" class="soft"/><text x="230" y="361" class="label" text-anchor="middle">NS-EL2</text><text x="230" y="394" class="small" text-anchor="middle">本系列不展开</text><rect x="425" y="320" width="270" height="92" rx="16" class="soft"/><text x="560" y="361" class="label" text-anchor="middle">S-EL2</text><text x="560" y="394" class="small" text-anchor="middle">本配置不使用</text><rect x="95" y="487" width="270" height="108" rx="16" class="card"/><text x="230" y="536" class="label" text-anchor="middle">Linux / TEE 驱动</text><text x="230" y="569" class="small" text-anchor="middle">NS-EL1</text><rect x="425" y="487" width="270" height="108" rx="16" class="card"/><text x="560" y="536" class="label" text-anchor="middle">OP-TEE / pseudo TA</text><text x="560" y="569" class="small" text-anchor="middle">S-EL1</text><rect x="95" y="685" width="270" height="96" rx="16" class="card"/><text x="230" y="728" class="label" text-anchor="middle">CA / libteec</text><text x="230" y="761" class="small" text-anchor="middle">NS-EL0</text><rect x="425" y="685" width="270" height="96" rx="16" class="card"/><text x="560" y="728" class="label" text-anchor="middle">用户 TA</text><text x="560" y="761" class="small" text-anchor="middle">S-EL0</text><path d="M95 542 L48 542 L48 184 L95 184" class="arrow"/><text x="37" y="457" class="small" text-anchor="start">SMC</text><path d="M695 184 L726 184 L726 542 L695 542" class="arrow"/><text x="635" y="457" class="small" text-anchor="start">ERET</text><path d="M180 685 L180 595" class="arrow"/><path d="M280 595 L280 685" class="arrow"/><rect x="135" y="618" width="190" height="38" fill="#f8fbfd"/><text x="230" y="648" class="small" text-anchor="middle">系统调用 / 返回</text><path d="M510 685 L510 595" class="arrow"/><path d="M610 595 L610 685" class="arrow"/><rect x="491" y="618" width="138" height="38" fill="#f8fbfd"/><text x="560" y="648" class="small" text-anchor="middle">SVC / ERET</text><text x="38" y="838" class="small" text-anchor="start">纵向：同一安全状态里的特权边界。</text><text x="38" y="874" class="small" text-anchor="start">横向：普通世界与安全世界之间的交接。</text><text x="38" y="910" class="small" text-anchor="start">EL2 留白不代表架构不存在；FF-A 部署另有布局。</text>
</svg>
