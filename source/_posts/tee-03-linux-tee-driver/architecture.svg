<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1245" viewBox="0 0 760 1245" role="img" aria-labelledby="title desc">
<title id="title">先初始化，再处理每一次 ioctl</title>
<desc id="desc">上半部分单独显示设备树、probe 和 TEE 设备注册的初始化流程。下半部分显示 libteec ioctl 经过 Linux TEE core、OP-TEE 驱动和 SMC 到 TF-A 的运行期请求流程。</desc>
<defs><marker id="head" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#087f8c"/></marker><marker id="mutedhead" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#65798f"/></marker></defs>
<style>text{font-family:system-ui,'Microsoft YaHei',sans-serif;fill:#15354f}.heading{font-size:32px;font-weight:700}.body{font-size:24px}.label{font-size:26px;font-weight:650}.small{font-size:22px;fill:#49657d}.section{font-size:24px;font-weight:650;fill:#0b6876}.white{font-size:26px;font-weight:650;fill:#fff}.whiteSmall{font-size:22px;fill:#d6eff3}.panel{fill:#eaf2f7;stroke:#d1dfe9;stroke-width:2}.card{fill:#fff;stroke:#87a8bc;stroke-width:2}.dark{fill:#153f5b;stroke:#153f5b;stroke-width:2}.soft{fill:#f4f7fa;stroke:#acbdcb;stroke-width:2;stroke-dasharray:7 5}.arrow{fill:none;stroke:#087f8c;stroke-width:3;marker-end:url(#head);stroke-linejoin:round}.dashed{fill:none;stroke:#65798f;stroke-width:2.5;stroke-dasharray:7 5;marker-end:url(#mutedhead);stroke-linejoin:round}.rule{fill:none;stroke:#a5bacb;stroke-width:2}</style>
<rect width="760" height="1245" fill="#f8fbfd"/>
<text x="38" y="57" class="heading" text-anchor="start">先初始化，再处理每一次 ioctl</text><text x="38" y="95" class="small" text-anchor="start">示意 · 选定的传统 SMC / AArch64 配置</text>
<rect x="32" y="128" width="696" height="340" rx="24" class="panel"/><text x="52" y="166" class="section" text-anchor="start">初始化：设备与驱动建立关系</text><rect x="115" y="189" width="530" height="68" rx="16" class="card"/><text x="380" y="218" class="label" text-anchor="middle">设备树 / 平台设备</text><text x="380" y="251" class="small" text-anchor="middle">描述 OP-TEE 接口与 conduit</text><rect x="115" y="283" width="530" height="68" rx="16" class="card"/><text x="380" y="312" class="label" text-anchor="middle">驱动匹配与 probe</text><text x="380" y="345" class="small" text-anchor="middle">确认能力、建立驱动资源</text><rect x="115" y="377" width="530" height="68" rx="16" class="card"/><text x="380" y="406" class="label" text-anchor="middle">注册 TEE 设备</text><text x="380" y="439" class="small" text-anchor="middle">用户态可通过设备节点访问</text><path d="M380 257 L380 283" class="arrow"/><path d="M380 351 L380 377" class="arrow"/><text x="38" y="513" class="small" text-anchor="start">probe 不是每次 TEEC_InvokeCommand 的入口。</text><rect x="32" y="549" width="696" height="610" rx="24" class="panel"/><text x="52" y="587" class="section" text-anchor="start">运行期：处理一次客户端请求</text><rect x="115" y="611" width="530" height="78" rx="16" class="card"/><text x="380" y="645" class="label" text-anchor="middle">CA / libteec · NS-EL0</text><text x="380" y="678" class="small" text-anchor="middle">ioctl：OPEN_SESSION / INVOKE</text><rect x="115" y="750" width="530" height="84" rx="16" class="card"/><text x="380" y="787" class="label" text-anchor="middle">Linux TEE core · NS-EL1</text><text x="380" y="820" class="small" text-anchor="middle">处理用户接口，分发设备操作</text><path d="M380 689 L380 750" class="arrow"/><text x="408" y="730" class="small" text-anchor="start">系统调用</text><rect x="115" y="895" width="530" height="84" rx="16" class="card"/><text x="380" y="932" class="label" text-anchor="middle">OP-TEE 驱动 · NS-EL1</text><text x="380" y="965" class="small" text-anchor="middle">协议转换与调用 / RPC 循环</text><path d="M380 834 L380 895" class="arrow"/><text x="408" y="875" class="small" text-anchor="start">驱动操作</text><rect x="115" y="1040" width="530" height="84" rx="16" class="dark"/><text x="380" y="1077" class="white" text-anchor="middle">TF-A BL31 / opteed · EL3</text><text x="380" y="1110" class="whiteSmall" text-anchor="middle">按服务分发到 OP-TEE</text><path d="M380 979 L380 1040" class="arrow"/><text x="408" y="1020" class="small" text-anchor="start">SMC</text><text x="38" y="1208" class="small" text-anchor="start">设备节点只是入口，后面还有内核接口与固件协议。</text>
</svg>
