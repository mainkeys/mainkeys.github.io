<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1405" viewBox="0 0 760 1405" role="img" aria-labelledby="title desc">
<title id="title">执行顺序和认证关系，是两张图</title>
<desc id="desc">上半图为经典 TF-A AArch64 启动交接：BL1、BL2 经 BL1 交接到 BL31，初始化 BL32 后返回 BL31，再进入 BL33 U-Boot 和 Linux。下半图仅说明开启 TBB 时从根信任经证书和摘要关系认证不同镜像，不能把执行箭头看成逐段验签。</desc>
<defs><marker id="head" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#087f8c"/></marker><marker id="mutedhead" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#65798f"/></marker></defs>
<style>text{font-family:system-ui,'Microsoft YaHei',sans-serif;fill:#15354f}.heading{font-size:32px;font-weight:700}.body{font-size:24px}.label{font-size:26px;font-weight:650}.small{font-size:22px;fill:#49657d}.section{font-size:24px;font-weight:650;fill:#0b6876}.white{font-size:26px;font-weight:650;fill:#fff}.whiteSmall{font-size:22px;fill:#d6eff3}.panel{fill:#eaf2f7;stroke:#d1dfe9;stroke-width:2}.card{fill:#fff;stroke:#87a8bc;stroke-width:2}.dark{fill:#153f5b;stroke:#153f5b;stroke-width:2}.soft{fill:#f4f7fa;stroke:#acbdcb;stroke-width:2;stroke-dasharray:7 5}.arrow{fill:none;stroke:#087f8c;stroke-width:3;marker-end:url(#head);stroke-linejoin:round}.dashed{fill:none;stroke:#65798f;stroke-width:2.5;stroke-dasharray:7 5;marker-end:url(#mutedhead);stroke-linejoin:round}.rule{fill:none;stroke:#a5bacb;stroke-width:2}</style>
<rect width="760" height="1405" fill="#f8fbfd"/>
<text x="38" y="57" class="heading" text-anchor="start">执行顺序和认证关系，是两张图</text><text x="38" y="95" class="small" text-anchor="start">示意 · 选定的传统 SMC / AArch64 配置</text>
<rect x="32" y="128" width="696" height="697" rx="24" class="panel"/><text x="52" y="168" class="section" text-anchor="start">执行顺序：当前是谁在运行</text><rect x="62" y="194" width="290" height="74" rx="16" class="card"/><text x="207" y="226" class="label" text-anchor="middle">BL1</text><text x="207" y="259" class="small" text-anchor="middle">早期固件</text><rect x="62" y="318" width="290" height="74" rx="16" class="card"/><text x="207" y="350" class="label" text-anchor="middle">BL2</text><text x="207" y="383" class="small" text-anchor="middle">装载与准备入口</text><path d="M207 268 L207 318" class="arrow"/><rect x="62" y="451" width="290" height="88" rx="16" class="dark"/><text x="207" y="490" class="white" text-anchor="middle">BL31 · EL3</text><text x="207" y="523" class="whiteSmall" text-anchor="middle">运行时服务</text><path d="M207 392 L207 451" class="arrow"/><text x="377" y="416" class="small" text-anchor="start">经典路径经 BL1 交接</text><rect x="432" y="451" width="270" height="88" rx="16" class="card"/><text x="567" y="490" class="label" text-anchor="middle">BL32 · OP-TEE</text><text x="567" y="523" class="small" text-anchor="middle">本配置的安全负载</text><path d="M352 474 L432 474" class="arrow"/><path d="M432 517 L352 517" class="arrow"/><text x="395" y="444" class="small" text-anchor="middle">初始化</text><text x="519" y="577" class="small" text-anchor="middle">初始化后返回 BL31</text><rect x="62" y="619" width="290" height="74" rx="16" class="card"/><text x="207" y="651" class="label" text-anchor="middle">BL33 · U-Boot</text><text x="207" y="684" class="small" text-anchor="middle">普通世界启动软件</text><path d="M207 539 L207 619" class="arrow"/><rect x="62" y="731" width="290" height="66" rx="16" class="card"/><text x="207" y="759" class="label" text-anchor="middle">Linux</text><text x="207" y="792" class="small" text-anchor="middle">继续系统启动</text><path d="M207 693 L207 731" class="arrow"/><text x="399" y="665" class="small" text-anchor="start">BL32 是可选阶段；</text><text x="399" y="703" class="small" text-anchor="start">BL33 也可由其他</text><text x="399" y="741" class="small" text-anchor="start">普通世界固件承担。</text><rect x="32" y="863" width="696" height="423" rx="24" class="panel"/><text x="52" y="904" class="section" text-anchor="start">认证依赖：仅在 TBB 开启时</text><rect x="128" y="932" width="504" height="80" rx="16" class="card"/><text x="380" y="967" class="label" text-anchor="middle">受保护的根信任材料</text><text x="380" y="1000" class="small" text-anchor="middle">例如根公钥哈希</text><rect x="128" y="1052" width="504" height="80" rx="16" class="card"/><text x="380" y="1087" class="label" text-anchor="middle">证书、密钥与摘要的认证依赖</text><text x="380" y="1120" class="small" text-anchor="middle">简化示意，省略各分支中间证书</text><path d="M380 1012 L380 1052" class="arrow"/><path d="M380 1132 L380 1163 L111 1163 L111 1194" class="arrow"/><path d="M380 1163 L291 1163 L291 1194" class="arrow"/><path d="M380 1163 L471 1163 L471 1194" class="arrow"/><path d="M380 1163 L649 1163 L649 1194" class="arrow"/><rect x="40" y="1194" width="142" height="62" rx="16" class="card"/><text x="111" y="1234" class="label" text-anchor="middle">BL2</text><rect x="220" y="1194" width="142" height="62" rx="16" class="card"/><text x="291" y="1234" class="label" text-anchor="middle">BL31</text><rect x="400" y="1194" width="142" height="62" rx="16" class="card"/><text x="471" y="1234" class="label" text-anchor="middle">BL32</text><rect x="578" y="1194" width="142" height="62" rx="16" class="card"/><text x="649" y="1234" class="label" text-anchor="middle">BL33</text><text x="38" y="1332" class="small" text-anchor="start">BL2 可在交接前认证多个后续镜像。</text><text x="38" y="1369" class="small" text-anchor="start">默认实验配置未启用 TBB；本图不是认证实验结果。</text>
</svg>
