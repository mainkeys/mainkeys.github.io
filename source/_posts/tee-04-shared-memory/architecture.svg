<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1030" viewBox="0 0 760 1030" role="img" aria-labelledby="title desc">
<title id="title">TA 为什么不能只接收一个指针</title>
<desc id="desc">上半图为 value 数值参数转换，下半图区分 CA 的虚拟地址、共享内存描述、实际共享页或临时中转区，以及 TA 虚拟映射。注册与复制取决于所用内存和实现，不能把地址数值直接当作跨世界可用指针。</desc>
<defs><marker id="head" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#087f8c"/></marker><marker id="mutedhead" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#65798f"/></marker></defs>
<style>text{font-family:system-ui,'Microsoft YaHei',sans-serif;fill:#15354f}.heading{font-size:32px;font-weight:700}.body{font-size:24px}.label{font-size:26px;font-weight:650}.small{font-size:22px;fill:#49657d}.section{font-size:24px;font-weight:650;fill:#0b6876}.white{font-size:26px;font-weight:650;fill:#fff}.whiteSmall{font-size:22px;fill:#d6eff3}.panel{fill:#eaf2f7;stroke:#d1dfe9;stroke-width:2}.card{fill:#fff;stroke:#87a8bc;stroke-width:2}.dark{fill:#153f5b;stroke:#153f5b;stroke-width:2}.soft{fill:#f4f7fa;stroke:#acbdcb;stroke-width:2;stroke-dasharray:7 5}.arrow{fill:none;stroke:#087f8c;stroke-width:3;marker-end:url(#head);stroke-linejoin:round}.dashed{fill:none;stroke:#65798f;stroke-width:2.5;stroke-dasharray:7 5;marker-end:url(#mutedhead);stroke-linejoin:round}.rule{fill:none;stroke:#a5bacb;stroke-width:2}</style>
<rect width="760" height="1030" fill="#f8fbfd"/>
<text x="38" y="57" class="heading" text-anchor="start">TA 为什么不能只接收一个指针</text><text x="38" y="95" class="small" text-anchor="start">示意 · 选定的传统 SMC / AArch64 配置</text>
<rect x="32" y="128" width="696" height="212" rx="24" class="panel"/><text x="52" y="169" class="section" text-anchor="start">value：参数中携带数值</text><rect x="52" y="204" width="184" height="95" rx="16" class="card"/><text x="144" y="246.5" class="label" text-anchor="middle">CA value</text><text x="144" y="279.5" class="small" text-anchor="middle">小整数</text><rect x="288" y="204" width="184" height="95" rx="16" class="card"/><text x="380" y="246.5" class="label" text-anchor="middle">协议字段</text><text x="380" y="279.5" class="small" text-anchor="middle">数值转换</text><rect x="524" y="204" width="184" height="95" rx="16" class="card"/><text x="616" y="246.5" class="label" text-anchor="middle">TA value</text><text x="616" y="279.5" class="small" text-anchor="middle">读取数值</text><path d="M236 251 L288 251" class="arrow"/><path d="M472 251 L524 251" class="arrow"/><rect x="32" y="382" width="696" height="526" rx="24" class="panel"/><text x="52" y="425" class="section" text-anchor="start">memref：描述一段可访问的数据</text><rect x="52" y="466" width="278" height="99" rx="16" class="card"/><text x="191" y="510.5" class="label" text-anchor="middle">CA buffer</text><text x="191" y="543.5" class="small" text-anchor="middle">进程虚拟地址</text><rect x="430" y="466" width="278" height="99" rx="16" class="card"/><text x="569" y="510.5" class="label" text-anchor="middle">TA memref</text><text x="569" y="543.5" class="small" text-anchor="middle">TA 中的虚拟映射</text><rect x="205" y="629" width="350" height="98" rx="16" class="card"/><text x="380" y="673" class="label" text-anchor="middle">共享内存描述</text><text x="380" y="706" class="small" text-anchor="middle">引用 / 偏移 / 长度</text><rect x="102" y="801" width="556" height="80" rx="16" class="card"/><text x="380" y="836" class="label" text-anchor="middle">共享页或临时中转缓冲区</text><text x="380" y="869" class="small" text-anchor="middle">驱动与 OP-TEE 建立访问范围</text><path d="M180 565 L180 766 L238 766 L238 801" class="arrow"/><text x="60" y="621" class="small" text-anchor="start">注册或复制</text><path d="M330 515 L380 515 L380 629" class="dashed"/><path d="M555 678 L570 678 L570 565" class="dashed"/><path d="M658 841 L687 841 L687 589 L643 589 L643 565" class="arrow"/><path d="M380 727 L380 801" class="dashed"/><text x="38" y="956" class="small" text-anchor="start">同一个地址数字，不代表同一个地址空间。</text><text x="38" y="993" class="small" text-anchor="start">具体映射与复制依配置而定；TA 仍需检查类型和长度。</text>
</svg>
