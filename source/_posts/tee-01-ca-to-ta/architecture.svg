<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1000" viewBox="0 0 760 1000" role="img" aria-labelledby="title desc">
<title id="title">一次 CA 请求的路径</title>
<desc id="desc">从普通世界的 CA 经 libteec、Linux TEE 驱动进入 EL3 的 TF-A，再到 S-EL1 的 OP-TEE 和 S-EL0 的用户 TA。结果经过对应边界返回。</desc>
<defs><marker id="head" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#087f8c"/></marker><marker id="mutedhead" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#65798f"/></marker></defs>
<style>text{font-family:system-ui,'Microsoft YaHei',sans-serif;fill:#15354f}.heading{font-size:32px;font-weight:700}.body{font-size:24px}.label{font-size:26px;font-weight:650}.small{font-size:22px;fill:#49657d}.section{font-size:24px;font-weight:650;fill:#0b6876}.white{font-size:26px;font-weight:650;fill:#fff}.whiteSmall{font-size:22px;fill:#d6eff3}.panel{fill:#eaf2f7;stroke:#d1dfe9;stroke-width:2}.card{fill:#fff;stroke:#87a8bc;stroke-width:2}.dark{fill:#153f5b;stroke:#153f5b;stroke-width:2}.soft{fill:#f4f7fa;stroke:#acbdcb;stroke-width:2;stroke-dasharray:7 5}.arrow{fill:none;stroke:#087f8c;stroke-width:3;marker-end:url(#head);stroke-linejoin:round}.dashed{fill:none;stroke:#65798f;stroke-width:2.5;stroke-dasharray:7 5;marker-end:url(#mutedhead);stroke-linejoin:round}.rule{fill:none;stroke:#a5bacb;stroke-width:2}</style>
<rect width="760" height="1000" fill="#f8fbfd"/>
<text x="38" y="57" class="heading" text-anchor="start">一次 CA 请求的路径</text><text x="38" y="95" class="small" text-anchor="start">示意 · 选定的传统 SMC / AArch64 配置</text>
<rect x="32" y="128" width="696" height="332" rx="24" class="panel"/><text x="52" y="160" class="section" text-anchor="start">Normal World</text><rect x="150" y="179" width="460" height="66" rx="16" class="card"/><text x="380" y="207" class="label" text-anchor="middle">CA</text><text x="380" y="240" class="small" text-anchor="middle">业务与 TEEC 调用</text><rect x="150" y="271" width="460" height="66" rx="16" class="card"/><text x="380" y="299" class="label" text-anchor="middle">libteec</text><text x="380" y="332" class="small" text-anchor="middle">会话、参数与 ioctl 封装</text><rect x="150" y="363" width="460" height="74" rx="16" class="card"/><text x="380" y="395" class="label" text-anchor="middle">Linux TEE core / OP-TEE 驱动</text><text x="380" y="428" class="small" text-anchor="middle">NS-EL1</text><path d="M380 245 L380 271" class="arrow"/><path d="M380 337 L380 363" class="arrow"/><text x="622" y="356" class="small" text-anchor="start">syscall</text><rect x="150" y="509" width="460" height="90" rx="16" class="dark"/><text x="380" y="549" class="white" text-anchor="middle">TF-A BL31 / opteed</text><text x="380" y="582" class="whiteSmall" text-anchor="middle">EL3 · 保存与恢复上下文</text><path d="M380 437 L380 509" class="arrow"/><text x="408" y="487" class="small" text-anchor="start">SMC</text><rect x="32" y="649" width="696" height="237" rx="24" class="panel"/><text x="52" y="681" class="section" text-anchor="start">Secure World</text><rect x="150" y="695" width="460" height="72" rx="16" class="card"/><text x="380" y="726" class="label" text-anchor="middle">OP-TEE core</text><text x="380" y="759" class="small" text-anchor="middle">S-EL1 · 会话与 TA 管理</text><rect x="150" y="799" width="460" height="66" rx="16" class="card"/><text x="380" y="827" class="label" text-anchor="middle">用户 TA</text><text x="380" y="860" class="small" text-anchor="middle">S-EL0 · command 处理</text><path d="M380 599 L380 695" class="arrow"/><text x="408" y="631" class="small" text-anchor="start">ERET</text><path d="M380 767 L380 799" class="arrow"/><text x="623" y="789" class="small" text-anchor="start">ERET</text><text x="38" y="931" class="small" text-anchor="start">结果经 TA → OP-TEE → Monitor → 驱动返回。</text><text x="38" y="967" class="small" text-anchor="start">运行中还可能发生 RPC；本图只表达主要边界。</text>
</svg>
